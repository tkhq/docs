<svg xmlns="http://www.w3.org/2000/svg" width="640" height="830" viewBox="0 0 640 830" role="img" aria-labelledby="title description">
  <title id="title">Custom policy enforcement architecture</title>
  <desc id="description">The application submits activities to Turnkey. Turnkey holds the consensus policy and transaction signing key. The TVC policy sidecar holds activity checks and a separate approval credential.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#eeeeef" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M2 1L6 5L2 9" fill="none" stroke="#a7acb4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <!-- Reused from /images/icons/server-04.svg -->
    <symbol id="app" viewBox="0 0 24 24" fill="none"><g transform="translate(0.9999, 1.5000)">
<path d="M21.0001 9L20.5257 5.20463C20.3396 3.71602 20.2466 2.97169 19.8963 2.4108C19.5876 1.91662 19.1417 1.52301 18.6131 1.27804C18.0131 1 17.263 1 15.7628 1H6.23746C4.73725 1 3.98714 1 3.38713 1.27804C2.85848 1.52301 2.41261 1.91662 2.10396 2.4108C1.75364 2.9717 1.6606 3.71601 1.47453 5.20463L1.00011 9M4.50011 13H17.5001M4.50011 13C2.56711 13 1.00011 11.433 1.00011 9.5C1.00011 7.567 2.56711 6 4.50011 6H17.5001C19.4331 6 21.0001 7.567 21.0001 9.5C21.0001 11.433 19.4331 13 17.5001 13M4.50011 13C2.56711 13 1.00011 14.567 1.00011 16.5C1.00011 18.433 2.56711 20 4.50011 20H17.5001C19.4331 20 21.0001 18.433 21.0001 16.5C21.0001 14.567 19.4331 13 17.5001 13M5.00011 9.5H5.01011M5.00011 16.5H5.01011M11.0001 9.5H17.0001M11.0001 16.5H17.0001" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</g></symbol>
    <!-- Reused from /images/icons/file-shield-02.svg -->
    <symbol id="policy" viewBox="0 0 24 24" fill="none"><g transform="translate(2.5000, 1.0000)">
<path d="M11 10H5M7 14H5M13 6H5M17 9V5.8C17 4.11984 17 3.27976 16.673 2.63803C16.3854 2.07354 15.9265 1.6146 15.362 1.32698C14.7202 1 13.8802 1 12.2 1H5.8C4.11984 1 3.27976 1 2.63803 1.32698C2.07354 1.6146 1.6146 2.07354 1.32698 2.63803C1 3.27976 1 4.11984 1 5.8V16.2C1 17.8802 1 18.7202 1.32698 19.362C1.6146 19.9265 2.07354 20.3854 2.63803 20.673C3.27976 21 4.11984 21 5.8 21H9.5M15 20C15 20 18 18.5701 18 16.4252V13.9229L15.8124 13.1412C15.2868 12.9529 14.712 12.9529 14.1864 13.1412L12 13.9229V16.4252C12 18.5701 15 20 15 20Z" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</g></symbol>
    <!-- Reused from /images/icons/lock-01.svg -->
    <symbol id="key" viewBox="0 0 24 24" fill="none"><g transform="translate(3.0000, 2.0000)">
<path d="M14 8V6C14 3.23858 11.7614 1 9 1C6.23858 1 4 3.23858 4 6V8M9 12.5V14.5M5.8 19H12.2C13.8802 19 14.7202 19 15.362 18.673C15.9265 18.3854 16.3854 17.9265 16.673 17.362C17 16.7202 17 15.8802 17 14.2V12.8C17 11.1198 17 10.2798 16.673 9.63803C16.3854 9.07354 15.9265 8.6146 15.362 8.32698C14.7202 8 13.8802 8 12.2 8H5.8C4.11984 8 3.27976 8 2.63803 8.32698C2.07354 8.6146 1.6146 9.07354 1.32698 9.63803C1 10.2798 1 11.1198 1 12.8V14.2C1 15.8802 1 16.7202 1.32698 17.362C1.6146 17.9265 2.07354 18.3854 2.63803 18.673C3.27976 19 4.11984 19 5.8 19Z" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</g></symbol>
    <!-- Reused from /images/icons/file-code-01.svg -->
    <symbol id="code" viewBox="0 0 24 24" fill="none"><g transform="translate(3.0000, 1.0000)">
<path d="M11 1.26959V5.40014C11 5.96019 11 6.24021 11.109 6.45412C11.2049 6.64229 11.3578 6.79527 11.546 6.89114C11.7599 7.00013 12.0399 7.00013 12.6 7.00013H16.7305M11 16.5001L13.5 14.0001L11 11.5001M7 11.5001L4.5 14.0001L7 16.5001M17 8.98829V16.2001C17 17.8802 17 18.7203 16.673 19.362C16.3854 19.9265 15.9265 20.3855 15.362 20.6731C14.7202 21.0001 13.8802 21.0001 12.2 21.0001H5.8C4.11984 21.0001 3.27976 21.0001 2.63803 20.6731C2.07354 20.3855 1.6146 19.9265 1.32698 19.362C1 18.7203 1 17.8802 1 16.2001V5.80006C1 4.11991 1 3.27983 1.32698 2.63809C1.6146 2.07361 2.07354 1.61466 2.63803 1.32704C3.27976 1.00006 4.11984 1.00006 5.8 1.00006H9.01178C9.74555 1.00006 10.1124 1.00006 10.4577 1.08295C10.7638 1.15644 11.0564 1.27766 11.3249 1.44214C11.6276 1.62767 11.887 1.8871 12.4059 2.40595L15.5941 5.59417C16.113 6.11303 16.3724 6.37246 16.5579 6.67521C16.7224 6.94363 16.8436 7.23626 16.9171 7.54237C17 7.88763 17 8.25452 17 8.98829Z" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</g></symbol>
    <!-- Reused from /images/icons/cpu-chip-01.svg -->
    <symbol id="enclave" viewBox="0 0 24 24" fill="none"><g transform="translate(1.0000, 1.0000)">
<path d="M8 1V3M14 1V3M8 19V21M14 19V21M19 8H21M19 13H21M1 8H3M1 13H3M7.8 19H14.2C15.8802 19 16.7202 19 17.362 18.673C17.9265 18.3854 18.3854 17.9265 18.673 17.362C19 16.7202 19 15.8802 19 14.2V7.8C19 6.11984 19 5.27976 18.673 4.63803C18.3854 4.07354 17.9265 3.6146 17.362 3.32698C16.7202 3 15.8802 3 14.2 3H7.8C6.11984 3 5.27976 3 4.63803 3.32698C4.07354 3.6146 3.6146 4.07354 3.32698 4.63803C3 5.27976 3 6.11984 3 7.8V14.2C3 15.8802 3 16.7202 3.32698 17.362C3.6146 17.9265 4.07354 18.3854 4.63803 18.673C5.27976 19 6.11984 19 7.8 19ZM9.6 14H12.4C12.9601 14 13.2401 14 13.454 13.891C13.6422 13.7951 13.7951 13.6422 13.891 13.454C14 13.2401 14 12.9601 14 12.4V9.6C14 9.03995 14 8.75992 13.891 8.54601C13.7951 8.35785 13.6422 8.20487 13.454 8.10899C13.2401 8 12.9601 8 12.4 8H9.6C9.03995 8 8.75992 8 8.54601 8.10899C8.35785 8.20487 8.20487 8.35785 8.10899 8.54601C8 8.75992 8 9.03995 8 9.6V12.4C8 12.9601 8 13.2401 8.10899 13.454C8.20487 13.6422 8.35785 13.7951 8.54601 13.891C8.75992 14 9.03995 14 9.6 14Z" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</g></symbol>
    <!-- Reused from /images/icons/check-circle.svg -->
    <symbol id="check" viewBox="0 0 24 24" fill="none"><g transform="translate(1.0000, 1.0000)">
<path d="M6.5 11L9.5 14L15.5 8M21 11C21 16.5228 16.5228 21 11 21C5.47715 21 1 16.5228 1 11C1 5.47715 5.47715 1 11 1C16.5228 1 21 5.47715 21 11Z" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</g></symbol>
  </defs>
  <style>
    text { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #505657; }
    .heading { font-size: 23px; font-weight: 700; fill: #5748ff; }
    .label { font-size: 22px; }
    .caption { font-size: 20px; fill: #70767b; }
    .card { fill: #ffffff; stroke: #d8dadd; stroke-width: 2; }
    .accent { fill: #eeedff; stroke: #5748ff; stroke-width: 2; }
    .connector { fill: none; stroke: #a7acb4; stroke-width: 2; marker-end: url(#arrow); }
    use { color: #5748ff; }
  </style>
  <rect width="640" height="830" fill="#fafafa"/>
  <rect width="640" height="830" fill="url(#grid)"/>

  <!-- Application identity -->
  <rect class="card" x="60" y="40" width="520" height="126" rx="18"/>
  <use href="#app" x="86" y="66" width="32" height="32"/>
  <text class="heading" x="136" y="90">YOUR APPLICATION</text>
  <text class="label" x="86" y="132">Initiator user + credential</text>
  <path class="connector" d="M320 174V206"/>

  <!-- Turnkey keeps the transaction signing key -->
  <rect x="60" y="222" width="520" height="218" rx="18" fill="#ffffff" stroke="#5748ff" stroke-width="2.5"/>
  <text class="heading" x="86" y="266">TURNKEY</text>
  <use href="#policy" x="86" y="290" width="32" height="32"/>
  <text class="label" x="136" y="315">Consensus policy</text>
  <use href="#key" x="86" y="342" width="32" height="32"/>
  <text class="label" x="136" y="367">Transaction signing key</text>
  <text class="caption" x="86" y="410">Collect approvals; execute activity</text>
  <path class="connector" d="M300 450V478"/>
  <path class="connector" d="M340 478V450"/>

  <!-- The approval credential is distinct from the signing key -->
  <rect class="accent" x="60" y="494" width="520" height="296" rx="18"/>
  <use href="#enclave" x="86" y="518" width="32" height="32"/>
  <text class="heading" x="136" y="543">TVC SECURE ENCLAVE</text>
  <rect class="card" x="82" y="568" width="476" height="198" rx="14"/>
  <text class="heading" x="106" y="603">POLICY SIDECAR</text>
  <use href="#check" x="106" y="620" width="28" height="28"/>
  <text class="label" x="150" y="643">Activity validation</text>
  <use href="#code" x="106" y="664" width="28" height="28"/>
  <text class="label" x="150" y="687">Application rules</text>
  <use href="#key" x="106" y="708" width="28" height="28"/>
  <text class="label" x="150" y="731">Approval credential</text>
</svg>
