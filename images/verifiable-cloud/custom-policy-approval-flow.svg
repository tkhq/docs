<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" role="img" aria-labelledby="title description">
  <title id="title">Activity approval flow</title>
  <desc id="description">The application submits a request. Turnkey awaits consensus and delivers a signed webhook. The sidecar checks and votes. Turnkey evaluates approvals, and the application retrieves the activity result.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#eeeeef" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M2 1L6 5L2 9" fill="none" stroke="#a7acb4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #505657; }
    .label { font-size: 22px; }
    .card { fill: #ffffff; stroke: #d8dadd; stroke-width: 2; }
    .accent { fill: #eeedff; stroke: #5748ff; stroke-width: 2; }
    .connector { fill: none; stroke: #a7acb4; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="640" height="820" fill="#fafafa"/>
  <rect width="640" height="820" fill="url(#grid)"/>

  <!-- Step 1 -->
  <rect class="card" x="90" y="40" width="510" height="96" rx="16"/>
  <circle cx="44" cy="88" r="19" fill="#858c96"/>
  <text x="44" y="95" text-anchor="middle" style="font-size:22px; font-weight:700; fill:white">1</text>
  <text x="114" y="71" style="font-size:18px; font-weight:700; fill:#5748ff">YOUR APPLICATION</text>
  <text class="label" x="114" y="108">Submit a request</text>
  <path class="connector" d="M345 141V161"/>

  <!-- Step 2 -->
  <rect class="card" x="90" y="166" width="510" height="96" rx="16"/>
  <circle cx="44" cy="214" r="19" fill="#858c96"/>
  <text x="44" y="221" text-anchor="middle" style="font-size:22px; font-weight:700; fill:white">2</text>
  <text x="114" y="197" style="font-size:18px; font-weight:700; fill:#5748ff">TURNKEY</text>
  <text class="label" x="114" y="234">Await consensus</text>
  <path class="connector" d="M345 267V287"/>

  <!-- Step 3 -->
  <rect class="card" x="90" y="292" width="510" height="96" rx="16"/>
  <circle cx="44" cy="340" r="19" fill="#858c96"/>
  <text x="44" y="347" text-anchor="middle" style="font-size:22px; font-weight:700; fill:white">3</text>
  <text x="114" y="323" style="font-size:18px; font-weight:700; fill:#5748ff">TURNKEY → TVC SIDECAR</text>
  <text class="label" x="114" y="360">Deliver signed webhook</text>
  <path class="connector" d="M345 393V413"/>

  <!-- Step 4 -->
  <rect class="accent" x="90" y="418" width="510" height="96" rx="16"/>
  <circle cx="44" cy="466" r="19" fill="#5748ff"/>
  <text x="44" y="473" text-anchor="middle" style="font-size:22px; font-weight:700; fill:white">4</text>
  <text x="114" y="449" style="font-size:18px; font-weight:700; fill:#5748ff">TVC SIDECAR → TURNKEY</text>
  <text class="label" x="114" y="486">Evaluate checks and vote</text>
  <path class="connector" d="M345 519V539"/>

  <!-- Step 5 -->
  <rect class="card" x="90" y="544" width="510" height="96" rx="16"/>
  <circle cx="44" cy="592" r="19" fill="#858c96"/>
  <text x="44" y="599" text-anchor="middle" style="font-size:22px; font-weight:700; fill:white">5</text>
  <text x="114" y="575" style="font-size:18px; font-weight:700; fill:#5748ff">TURNKEY</text>
  <text class="label" x="114" y="612">Evaluate approvals</text>
  <path class="connector" d="M345 645V665"/>

  <!-- Step 6 -->
  <rect class="card" x="90" y="670" width="510" height="96" rx="16"/>
  <circle cx="44" cy="718" r="19" fill="#858c96"/>
  <text x="44" y="725" text-anchor="middle" style="font-size:22px; font-weight:700; fill:white">6</text>
  <text x="114" y="701" style="font-size:18px; font-weight:700; fill:#5748ff">YOUR APPLICATION</text>
  <text class="label" x="114" y="738">Retrieve activity result</text>
</svg>
